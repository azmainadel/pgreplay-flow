[project]
name = "pgreplay-flow"
version = "0.1.0"
description = "Durable async workflows on plain Postgres: crash-safe steps, durable retries, deterministic replay."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
]

[project.scripts]
pgreplay-flow = "pgreplay_flow.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgreplay_flow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
